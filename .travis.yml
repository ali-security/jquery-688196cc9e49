language: node_js
sudo: false
# Never restore node_modules from a previous build: a cached tree resolved
# against the live registry bypasses the time machine below.
cache: false

# Resolve npm dependencies as of the jQuery 3.0.0 release (2016-06-09) so that
# old Node versions do not pull in packages using newer syntax.
before_install:
- npm config set registry https://time-machines-npm.sealsecurity.io/
- npm config set //time-machines-npm.sealsecurity.io/:_authToken 2016-06-09T18:33:13.420Z
- npm config set always-auth true

jobs:
  include:
  - name: node-0.10
    language: node_js
    node_js: "0.10"
    script: npm test
  - name: node-0.12
    language: node_js
    node_js: "0.12"
    script: npm test
  - name: node-4
    language: node_js
    node_js: "4"
    script: npm test
  - name: node-6
    language: node_js
    node_js: "6"
    script: npm test

  # Browser QUnit suite (test/index.html), which upstream ran on TestSwarm.
  # Built with Node 6, driven by headless Chrome via puppeteer-core on Node 20.
  - name: qunit-browser
    language: node_js
    node_js: "6"
    addons:
      chrome: stable
      apt:
        packages:
        - php-cli
    env:
    # Modern Chrome forbids synchronous XHR during page unload (Chrome 80+), so
    # the request in test/data/ajax/onunload.html always completes with "error".
    - 'SEAL_SKIP_TESTS="ajax: #14379 - jQuery.ajax() on unload"'
    install:
    - npm install
    - ./node_modules/.bin/grunt
    - nvm install 20
    - node --version
    - >-
      (mkdir -p /tmp/driver && cd /tmp/driver && npm init -y &&
      npm install puppeteer-core@22 --userconfig=/dev/null
      --registry=https://registry.npmjs.org/)
    script:
    - php --version
    - export CHROME_BIN="$(which google-chrome-stable)"
    - $CHROME_BIN --version
    # Multiple PHP workers: a single-process server serializes the iframe
    # fixture loads and spuriously fails the ready/iframe tests.
    - >-
      PHP_CLI_SERVER_WORKERS=10 php -S 127.0.0.1:8000 -t . > /tmp/php-server.log 2>&1 &
    - >-
      for i in $(seq 1 30); do
      curl -sf -o /dev/null http://127.0.0.1:8000/test/index.html && break;
      sleep 1; done
    - curl -sf -o /dev/null http://127.0.0.1:8000/test/index.html
    - >-
      NODE_PATH=/tmp/driver/node_modules node test/seal-browser-runner.js
      "http://127.0.0.1:8000/test/index.html?dev"
    after_failure:
    - tail -n 100 /tmp/php-server.log
